name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install numpy==2.5.4 ruff==0.17.4
      - run: make lint
      - run: make test
      - run: make data-check
      - name: Results and docs match a fresh run
        run: |
          make tune experiment readme misses
          git diff --exit-code results docs/RETRIEVAL.md docs/MISSES.md
